<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width"> 
        <title>Buscador de GitHub</title>
        <style>
             body{
                background: rgb(241, 211, 129);
                color: rgb(8, 8, 8);
                font-family:'Courier New', Courier, monospace;
                text-align: center;
             }
             .Button{
                font-family:'Courier New', Courier, monospace;
                color: rgb(2, 2, 2);
                background: rgb(245, 237, 217);
                border-radius: 20px;
                border-style: solid;
                padding: 4px;
             }
             .Button:hover{
                color: red;
             }
             .Button:active{
                color: blue;
             }
             .Pantalla{
                border-style: solid;
                border-radius: 20px;
                background: rgb(245, 237, 217);
                padding: 4px;
                color: rgb(2, 2, 2);
                border-style: solid;
             }
        </style>
    </head>
    <body>
        <h1>Buscar perfil de GitHub</h1>
       
        <input class="Pantalla" type="text" id="username" placeholder="Introduce un Usuario" required>
        <button class="Button" id="Button1">Buscar</button>
        <br><br>
        <div id="resultado">...</div>
        <script src="BusquedaPerfiles.js"></script>
    </body>
</html>
