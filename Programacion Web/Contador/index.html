<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width">
        <title>Contador</title>

        <style>
             body{
                background: rgb(241, 211, 129);
                color: rgb(8, 8, 8);
                font-family:'Courier New', Courier, monospace;
                text-align: center;
             }
             .Button{
                font-family:'Courier New', Courier, monospace;
                color: rgb(2, 2, 2);
                background: rgb(245, 237, 217);
                border-radius: 20px;
                border-style: solid;
                padding: 4px;
             }
             .Button:hover{
                color: red;
             }
             .Button:active{
                color: blue;
             }
             .Pantalla{
                border-style: solid;
                border-radius: 20px;
                background: rgb(245, 237, 217);
                padding: 4px;
                display:inline-block; 
                width: 450px
             }
              .Pantalla1{
                border-style: solid;
                border-radius: 20px;
                background: rgb(245, 237, 217);
                padding: 4px;
                display:inline-block; 
                width: 200px
             }
              .Pantalla2{
                border-style: solid;
                border-radius: 20px;
                background: rgb(245, 237, 217);
                padding: 4px;
                display:inline-block; 
                width: 200px
             }
             
        </style>
    </head>
    <body>
        <h1>Contador</h1>
        <div class="Pantalla" id="Pantalla">0</div><br><br>
        <button class="Button" id="Button1">Incremento</button>
        <button class="Button" id="Button2">Decremento</button><br><br>
        <div class="Pantalla1" id="incPantalla">0 Click</div>
        <div class="Pantalla2" id="decPantalla" >0 Click</div>
        <script src="Contador.js"></script>
    </body>
</html>
